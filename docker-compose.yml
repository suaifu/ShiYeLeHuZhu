# 重启 · 失业互助平台 - 生产环境部署配置
# 使用前修改 .env 文件中的密码和域名

version: "3.8"

services:
  # ─── PostgreSQL ───
  db:
    image: postgres:14-alpine
    container_name: restart_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-restart_db}
      POSTGRES_USER: ${DB_USER:-restart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./api/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-restart}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── FastAPI 后端 ───
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: restart_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-restart}:${DB_PASSWORD:-change_this_password}@db:5432/${DB_NAME:-restart_db}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret}
      DEBUG: "false"
    ports:
      - "127.0.0.1:8000:8000"

  # ─── Nginx 反向代理 ───
  nginx:
    image: nginx:alpine
    container_name: restart_nginx
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./restart.html:/usr/share/nginx/html/index.html:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    environment:
      DOMAIN: ${DOMAIN:-localhost}

volumes:
  db_data:

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>失业互助台</title>
<style>
/* ===== Reset & Base ===== */
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#FAFAF9;color:#1F2937;line-height:1.6;font-size:15px;padding-bottom:70px}
:root{--amber:#F59E0B;--amber-dark:#D97706;--amber-light:#FEF3C7;--red:#EF4444;--red-light:#FEE2E2;--green:#10B981;--green-light:#D1FAE5;--gray:#6B7280;--gray-light:#F3F4F6;--border:#E5E7EB;--card:#FFFFFF}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:16px;outline:none}
a{color:var(--amber-dark);text-decoration:none}

/* ===== Layout ===== */
.container{max-width:900px;margin:0 auto;padding:0 16px}

/* ===== Header ===== */
.header{background:#fff;border-bottom:1px solid var(--border);padding:12px 0;position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;color:#1F2937}
.header-title svg{width:24px;height:24px;flex-shrink:0}
.header-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn-sm{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:4px;transition:.15s}
.btn-sm svg{width:14px;height:14px}
.btn-export{background:var(--amber-light);color:var(--amber-dark)}
.btn-export:active{background:#FDE68A}
.btn-import{background:var(--gray-light);color:#4B5563}
.btn-import:active{background:#E5E7EB}

/* ===== Backup Reminder ===== */
.backup-reminder{background:#FFF7ED;border:1px solid #FDBA74;color:#9A3412;padding:10px 16px;font-size:13px;text-align:center;display:none}

/* ===== Today Section ===== */
.today-section{background:#fff;border-bottom:1px solid var(--border);padding:12px 0}
.today-title{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#6B7280;margin-bottom:10px}
.today-title svg{width:16px;height:16px}
.today-list{display:flex;flex-direction:column;gap:6px}
.today-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:14px}
.today-item.overdue{background:var(--red-light);color:#991B1B}
.today-item.today-task{background:var(--amber-light);color:#92400E}
.today-item.reminder{background:#EFF6FF;color:#1E40AF}
.today-item svg{width:16px;height:16px;flex-shrink:0}
.today-item-text{flex:1;min-width:0}
.today-item-action{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0}
.today-item.overdue .today-item-action{background:var(--red);color:#fff}
.today-item.today-task .today-item-action{background:var(--amber);color:#fff}
.today-item.reminder .today-item-action{background:#3B82F6;color:#fff}
.today-empty{text-align:center;color:var(--gray);font-size:13px;padding:8px}

/* ===== Tab Navigation ===== */
.tab-nav{display:flex;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:49px;z-index:99}
.tab-item{flex:1;padding:10px 4px;text-align:center;font-size:13px;font-weight:500;color:var(--gray);border-bottom:2px solid transparent;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab-item svg{width:20px;height:20px}
.tab-item.active{color:var(--amber-dark);border-bottom-color:var(--amber)}

/* ===== Module Sections ===== */
.module{display:none;padding:16px 0}
.module.active{display:block}
.module-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.module-title{font-size:18px;font-weight:700}
.btn-add{background:var(--amber);color:#fff;padding:8px 16px;border-radius:10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px}
.btn-add:active{background:var(--amber-dark)}
.btn-add svg{width:16px;height:16px}

/* ===== Cards ===== */
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-title{font-size:15px;font-weight:600;margin-bottom:8px}

/* ===== Stats Row ===== */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:10px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-num{font-size:22px;font-weight:700}
.stat-label{font-size:11px;color:var(--gray);margin-top:2px}
.stat-card.apply .stat-num{color:#3B82F6}
.stat-card.interview .stat-num{color:var(--amber)}
.stat-card.offer .stat-num{color:var(--green)}
.stat-card.reject .stat-num{color:var(--red)}

/* ===== Filter Chips ===== */
.filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{padding:5px 14px;border-radius:20px;font-size:13px;background:var(--gray-light);color:var(--gray);font-weight:500}
.chip.active{background:var(--amber);color:#fff}

/* ===== Job Card ===== */
.job-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative}
.job-card-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:6px}
.job-company{font-size:16px;font-weight:600}
.job-position{font-size:13px;color:var(--gray)}
.job-salary{font-size:13px;color:var(--amber-dark);font-weight:600}
.status-badge{padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.status-投递{background:#DBEAFE;color:#1E40AF}
.status-笔试{background:#E0E7FF;color:#3730A3}
.status-面试{background:var(--amber-light);color:#92400E}
.status-Offer{background:var(--green-light);color:#065F46}
.status-拒绝{background:var(--red-light);color:#991B1B}
.status-已放弃{background:var(--gray-light);color:#6B7280}
.job-meta{display:flex;gap:12px;font-size:12px;color:var(--gray);margin-top:6px;flex-wrap:wrap}
.job-meta span{display:flex;align-items:center;gap:3px}
.job-meta svg{width:12px;height:12px}
.job-feedback{margin-top:6px;padding:6px 10px;background:var(--gray-light);border-radius:6px;font-size:13px;color:#4B5563}
.job-actions{display:flex;gap:6px;margin-top:8px}
.job-actions button{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500}
.btn-edit{background:#E0F2FE;color:#0369A1}
.btn-del{background:var(--red-light);color:#991B1B}

/* ===== Diary Module ===== */
.day-counter{text-align:center;padding:24px 16px;background:linear-gradient(135deg,#FEF3C7,#FDE68A);border-radius:16px;margin-bottom:16px}
.day-counter-num{font-size:42px;font-weight:800;color:var(--amber-dark);line-height:1}
.day-counter-label{font-size:14px;color:#92400E;margin-top:4px}
.day-counter-since{font-size:12px;color:#B45309;margin-top:6px}

.quote-card{background:linear-gradient(135deg,#FFF7ED,#FFEDD5);border-radius:14px;padding:18px;margin-bottom:16px;text-align:center;border:1px solid #FED7AA}
.quote-text{font-size:16px;font-weight:600;color:#9A3412;line-height:1.5}
.quote-actions{display:flex;gap:8px;justify-content:center;margin-top:12px}
.btn-quote{padding:6px 16px;border-radius:8px;font-size:13px;font-weight:500}
.btn-refresh{background:#fff;color:var(--amber-dark);border:1px solid #FDBA74}
.btn-share{background:var(--amber);color:#fff}

.mood-section{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.mood-label{font-size:14px;font-weight:600;margin-bottom:10px}
.mood-options{display:flex;justify-content:space-around;gap:4px}
.mood-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;transition:.15s;min-width:44px}
.mood-btn svg{width:32px;height:32px}
.mood-btn-label{font-size:11px;color:var(--gray)}
.mood-btn.selected{background:var(--amber-light)}
.mood-btn.selected .mood-btn-label{color:var(--amber-dark);font-weight:600}
.achievement-input{margin-top:12px;width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px}
.achievement-input:focus{border-color:var(--amber)}
.btn-checkin{width:100%;margin-top:10px;padding:10px;background:var(--amber);color:#fff;border-radius:10px;font-size:15px;font-weight:600}
.btn-checkin:active{background:var(--amber-dark)}
.btn-checkin.done{background:var(--green);color:#fff}

.diary-list{margin-top:16px}
.diary-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.diary-mood{width:32px;height:32px;flex-shrink:0}
.diary-info{flex:1;min-width:0}
.diary-date{font-size:12px;color:var(--gray)}
.diary-achievement{font-size:14px}
.diary-del{color:var(--gray);padding:4px}
.diary-del svg{width:16px;height:16px}

/* ===== Share Card Overlay ===== */
.share-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:20px}
.share-overlay.show{display:flex}
.share-card{background:linear-gradient(135deg,#FEF3C7,#FDE68A);border-radius:20px;padding:32px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.share-day{font-size:36px;font-weight:800;color:var(--amber-dark)}
.share-day-label{font-size:13px;color:#92400E;margin-bottom:16px}
.share-quote{font-size:17px;font-weight:600;color:#78350F;line-height:1.6;margin-bottom:16px}
.share-date{font-size:12px;color:#B45309}
.share-close{margin-top:16px;padding:8px 24px;border-radius:8px;background:#fff;color:var(--amber-dark);font-size:14px;font-weight:600}
.share-tip{color:rgba(255,255,255,.8);font-size:12px;text-align:center;margin-top:12px}

/* ===== Finance Module ===== */
.finance-summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.finance-card{background:#fff;border-radius:12px;padding:16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.finance-card-label{font-size:12px;color:var(--gray);margin-bottom:4px}
.finance-card-num{font-size:20px;font-weight:700}
.finance-card-sub{font-size:11px;color:var(--gray);margin-top:4px}
.finance-card.expense .finance-card-num{color:var(--red)}
.finance-card.income .finance-card-num{color:var(--green)}
.finance-card.savings .finance-card-num{color:var(--amber-dark)}

.budget-ring-wrapper{display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.budget-ring{position:relative;width:140px;height:140px}
.budget-ring svg{transform:rotate(-90deg)}
.budget-ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.budget-ring-num{font-size:22px;font-weight:700}
.budget-ring-label{font-size:11px;color:var(--gray)}

.pie-section{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pie-title{font-size:14px;font-weight:600;margin-bottom:12px}
.pie-wrapper{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.pie-legend{display:flex;flex-direction:column;gap:6px}
.pie-legend-item{display:flex;align-items:center;gap:6px;font-size:13px}
.pie-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

.txn-list{margin-top:8px}
.txn-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.txn-cat{flex-shrink:0;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.txn-info{flex:1;min-width:0}
.txn-cat-name{font-size:14px;font-weight:500}
.txn-note{font-size:12px;color:var(--gray)}
.txn-amount{font-weight:700;font-size:15px;flex-shrink:0}
.txn-amount.expense{color:var(--red)}
.txn-amount.income{color:var(--green)}
.txn-del{padding:4px;color:var(--gray)}
.txn-del svg{width:16px;height:16px}

/* ===== Skills Module ===== */
.skill-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.skill-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:8px}
.skill-name{font-size:16px;font-weight:600}
.skill-type{font-size:12px;color:var(--gray);margin-top:2px}
.skill-streak{display:flex;align-items:center;gap:3px;font-size:13px;color:var(--amber-dark);font-weight:600}
.skill-streak svg{width:14px;height:14px}
.skill-progress-bar{height:8px;background:var(--gray-light);border-radius:4px;margin:8px 0;overflow:hidden}
.skill-progress-fill{height:100%;background:var(--amber);border-radius:4px;transition:width .3s}
.skill-progress-text{display:flex;justify-content:space-between;font-size:12px;color:var(--gray)}
.skill-actions{display:flex;gap:6px;margin-top:8px}
.btn-checkin-skill{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;background:var(--amber-light);color:var(--amber-dark)}
.btn-checkin-skill.done{background:var(--green-light);color:#065F46}
.btn-edit-skill{padding:6px 14px;border-radius:8px;font-size:13px;background:#E0F2FE;color:#0369A1}
.btn-del-skill{padding:6px 14px;border-radius:8px;font-size:13px;background:var(--red-light);color:#991B1B}

.skill-heatmap{margin-top:10px;display:flex;gap:3px;flex-wrap:wrap}
.heat-cell{width:18px;height:18px;border-radius:3px;background:var(--gray-light)}
.heat-cell.l1{background:#FDE68A}
.heat-cell.l2{background:#FCD34D}
.heat-cell.l3{background:#F59E0B}
.heat-cell.l4{background:#D97706}

/* ===== Modal ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;padding:20px;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px;text-align:center}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:13px;color:var(--gray);margin-bottom:4px;font-weight:500}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:16px}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--amber)}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.btn-cancel{flex:1;padding:10px;border-radius:10px;background:var(--gray-light);color:var(--gray);font-size:15px;font-weight:600}
.btn-save{flex:1;padding:10px;border-radius:10px;background:var(--amber);color:#fff;font-size:15px;font-weight:600}
.btn-save:active{background:var(--amber-dark)}

/* ===== Confirm Modal ===== */
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;padding:20px;align-items:center;justify-content:center}
.confirm-overlay.show{display:flex}
.confirm-box{background:#fff;border-radius:16px;padding:24px;max-width:320px;width:100%;text-align:center}
.confirm-title{font-size:16px;font-weight:600;margin-bottom:8px}
.confirm-text{font-size:14px;color:var(--gray);margin-bottom:16px}
.confirm-actions{display:flex;gap:8px}
.confirm-actions button{flex:1;padding:10px;border-radius:10px;font-size:15px;font-weight:600}
.btn-no{background:var(--gray-light);color:var(--gray)}
.btn-yes{background:var(--red);color:#fff}

/* ===== Empty State ===== */
.empty{text-align:center;padding:32px 16px;color:var(--gray)}
.empty svg{width:48px;height:48px;opacity:.3;margin-bottom:8px}
.empty-text{font-size:14px}

/* ===== Mobile Bottom Tab ===== */
@media(min-width:768px){.tab-nav{position:sticky;top:49px}}

@media(max-width:767px){
  body{padding-bottom:64px}
  .header-title{font-size:16px}
  .header-title span{display:none}
  .header-actions .btn-label{display:none}
  .btn-sm{padding:6px 8px}
  .tab-nav{display:none}
  .mobile-tab{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
  .mobile-tab-item{flex:1;padding:8px 4px;text-align:center;font-size:11px;color:var(--gray);display:flex;flex-direction:column;align-items:center;gap:2px}
  .mobile-tab-item svg{width:22px;height:22px}
  .mobile-tab-item.active{color:var(--amber-dark)}
  .module{padding:12px 0}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .finance-summary{grid-template-columns:1fr}
  .day-counter-num{font-size:36px}
  .modal{border-radius:16px 16px 0 0}
}
.mobile-tab{display:none}

/* Settings inline */
.settings-inline{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.settings-inline-title{font-size:14px;font-weight:600;margin-bottom:10px}
.settings-inline-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.settings-inline-row label{font-size:13px;color:var(--gray);min-width:90px}
.settings-inline-row input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px}
</style>
</head>
<body>

<!-- ===== Header ===== -->
<div class="header">
  <div class="container header-inner">
    <div class="header-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <span>失业互助台</span>
    </div>
    <div class="header-actions">
      <button class="btn-sm btn-export" onclick="exportJSON()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="btn-label">导出备份</span>
      </button>
      <button class="btn-sm btn-import" onclick="document.getElementById('importFile').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span class="btn-label">导入恢复</span>
      </button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
    </div>
  </div>
</div>

<!-- ===== Backup Reminder ===== -->
<div class="backup-reminder" id="backupReminder"></div>

<!-- ===== Today Section ===== -->
<div class="today-section">
  <div class="container">
    <div class="today-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>今天要处理</span>
    </div>
    <div class="today-list" id="todayList"></div>
  </div>
</div>

<!-- ===== Tab Navigation (Desktop) ===== -->
<div class="tab-nav">
  <button class="tab-item active" data-tab="jobs" onclick="switchTab('jobs')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
    求职进度
  </button>
  <button class="tab-item" data-tab="diary" onclick="switchTab('diary')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    失业日记
  </button>
  <button class="tab-item" data-tab="finance" onclick="switchTab('finance')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg>
    财务精算
  </button>
  <button class="tab-item" data-tab="skills" onclick="switchTab('skills')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    技能充电
  </button>
</div>

<!-- ===== Mobile Tab Bar ===== -->
<div class="mobile-tab">

/* ===== Storage Keys ===== */
const PREFIX = 'wb_unemployment_';
const KEYS = {
  jobs: PREFIX+'jobs',
  diary: PREFIX+'diary',
  finance: PREFIX+'finance',
  skills: PREFIX+'skills',
  settings: PREFIX+'settings'
};

/* ===== Storage Helpers ===== */
function getData(key){
  try{ return JSON.parse(localStorage.getItem(key)) || []; }catch(e){ return []; }
}
function setData(key,val){ localStorage.setItem(key, JSON.stringify(val)); }
function getSettings(){
  try{
    let s = JSON.parse(localStorage.getItem(KEYS.settings));
    if(!s) s = {};
    if(!s.unemploymentStart) s.unemploymentStart = '2026-07-01';
    if(!s.monthlyBudget) s.monthlyBudget = 5000;
    if(!s.savings) s.savings = 50000;
    return s;
  }catch(e){ return {unemploymentStart:'2026-07-01',monthlyBudget:5000,savings:50000}; }
}
function saveSettings(){ setData(KEYS.settings, getSettings()); }

/* ===== Date Helpers ===== */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '--'; const dt = new Date(d); return (dt.getMonth()+1)+'月'+dt.getDate()+'日'; }
function fmtDateFull(d){ if(!d) return '--'; return d.replace(/-/g,'/'); }
function daysBetween(d1,d2){ const diff = new Date(d2) - new Date(d1); return Math.floor(diff/86400000); }
function getMonthStr(d){ return d.slice(0,7); }

/* ===== Tab Navigation ===== */
function switchTab(tab){
  document.querySelectorAll('.module').forEach(m=>m.classList.remove('active'));
  document.getElementById('module-'+tab).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  document.querySelectorAll('.mobile-tab-item').forEach(t=>t.classList.toggle('active', t.dataset.mtab===tab));
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ===== Today Section ===== */
function renderToday(){
  const today = todayStr();
  const list = document.getElementById('todayList');
  const items = [];

  // Jobs: overdue follow-ups
  const jobs = getData(KEYS.jobs);
  jobs.forEach(j=>{
    if(['面试','笔试'].includes(j.status) && j.followDate && j.followDate < today){
      items.push({type:'overdue',text:`${j.company} - ${j.position}：跟进已超期（${fmtDate(j.followDate)}）`,action:'去跟进',onclick:`switchTab('jobs')`});
    }
    if(j.status==='面试' && j.followDate === today){
      items.push({type:'today-task',text:`${j.company} - ${j.position}：今天有面试/跟进`,action:'查看',onclick:`switchTab('jobs')`});
    }
  });

  // Diary: not checked in today
  const diary = getData(KEYS.diary);
  if(!diary.find(d=>d.date===today)){
    items.push({type:'reminder',text:'今日日记还未打卡',action:'去打卡',onclick:`switchTab('diary')`});
  }

  // Skills: not checked in today
  const skills = getData(KEYS.skills);
  skills.forEach(s=>{
    if(s.checkins && !s.checkins[today]){
      items.push({type:'reminder',text:`「${s.name}」今日未打卡`,action:'去打卡',onclick:`switchTab('skills')`});
    }
  });

  // Finance: budget warning
  const settings = getSettings();
  const finance = getData(KEYS.finance);
  const monthStr = getMonthStr(today);
  const monthExpense = finance.filter(f=>f.type==='expense'&&getMonthStr(f.date)===monthStr).reduce((s,f)=>s+f.amount,0);
  if(monthExpense > settings.monthlyBudget){
    items.push({type:'overdue',text:`本月支出 ¥${monthExpense} 已超出预算 ¥${settings.monthlyBudget}`,action:'查看',onclick:`switchTab('finance')`});
  }

  if(items.length===0){
    list.innerHTML = '<div class="today-empty">今天没有待处理的事项，保持节奏！</div>';
  } else {
    list.innerHTML = items.map(it=>`
      <div class="today-item ${it.type}">
        ${it.type==='overdue'?ICONS.alert:it.type==='today-task'?ICONS.bell:ICONS.calendar}
        <span class="today-item-text">${it.text}</span>
        <button class="today-item-action" onclick="${it.onclick}">${it.action}</button>
      </div>
    `).join('');
  }
}

function renderJobs(){
  const jobs = getData(KEYS.jobs);

  document.getElementById('statApply').textContent = jobs.filter(j=>j.status==='投递').length;
  document.getElementById('statInterview').textContent = jobs.filter(j=>['面试','笔试'].includes(j.status)).length;
  document.getElementById('statOffer').textContent = jobs.filter(j=>j.status==='Offer').length;
  document.getElementById('statReject').textContent = jobs.filter(j=>j.status==='拒绝').length;

  // List
  const filtered = jobFilter==='全部' ? jobs : jobs.filter(j=>j.status===jobFilter);
  const list = document.getElementById('jobList');
  if(filtered.length===0){
    list.innerHTML = `<div class="empty">${ICONS.empty}<div class="empty-text">还没有投递记录，点击「新增投递」开始</div></div>`;
    return;
  }

  filtered.sort((a,b)=>(b.applyDate||'').localeCompare(a.applyDate||''));
  list.innerHTML = filtered.map(j=>`
    <div class="job-card">
      <div class="job-card-header">
        <div>
          <div class="job-company">${j.company}</div>
          <div class="job-position">${j.position}</div>
        </div>
        <div style="text-align:right">
          <span class="status-badge status-${j.status}">${j.status}</span>
          ${j.salary?`<div class="job-salary" style="margin-top:4px">${j.salary}</div>`:''}
        </div>
      </div>
      <div class="job-meta">
        <span>${ICONS.calendar} 投递：${fmtDate(j.applyDate)}</span>
        ${j.followDate?`<span>${ICONS.calendar} 跟进：${fmtDate(j.followDate)}</span>`:''}
      </div>
      ${j.feedback?`<div class="job-feedback">${j.feedback}</div>`:''}
      <div class="job-actions">
        <button class="btn-edit" onclick="editJob('${j.id}')">编辑</button>

    document.getElementById('jobModalTitle').textContent = '编辑投递';
    document.getElementById('jobId').value = j.id;

    document.getElementById('jobPosition').value = j.position||'';
    document.getElementById('jobSalary').value = j.salary||'';
    document.getElementById('jobApplyDate').value = j.applyDate||'';
    document.getElementById('jobStatus').value = j.status||'投递';
    document.getElementById('jobFollowDate').value = j.followDate||'';
    document.getElementById('jobFeedback').value = j.feedback||'';
  } else {
    document.getElementById('jobModalTitle').textContent = '新增投递';
    document.getElementById('jobId').value = '';
    document.getElementById('jobCompany').value = '';
    document.getElementById('jobPosition').value = '';
    document.getElementById('jobSalary').value = '';
    document.getElementById('jobApplyDate').value = todayStr();

function saveJob(){
  const company = document.getElementById('jobCompany').value.trim();
  const position = document.getElementById('jobPosition').value.trim();
  if(!company || !position){ alert('请填写公司名称和职位'); return; }
  const job = {
    id: document.getElementById('jobId').value || genId(),
    company,
    position,
    salary: document.getElementById('jobSalary').value.trim(),
    applyDate: document.getElementById('jobApplyDate').value,
    status: document.getElementById('jobStatus').value,
    followDate: document.getElementById('jobFollowDate').value,
    feedback: document.getElementById('jobFeedback').value.trim()
  };
  const jobs = getData(KEYS.jobs);
  const idx = jobs.findIndex(j=>j.id===job.id);
  if(idx>=0) jobs[idx]=job; else jobs.push(job);
  setData(KEYS.jobs, jobs);
  closeModal('jobModal');
  renderJobs();
  renderToday();
  checkBackupReminder();
}

    const jobs = getData(KEYS.jobs).filter(j=>j.id!==id);
    setData(KEYS.jobs, jobs);
    renderJobs();
    renderToday();
  });
}

function renderFinance(){
  const s = getSettings();
  document.getElementById('monthlyBudget').value = s.monthlyBudget;
  document.getElementById('savingsAmount').value = s.savings;
  const finance = getData(KEYS.finance);
  const monthStr = getMonthStr(todayStr());
  const monthTxns = finance.filter(f=>getMonthStr(f.date)===monthStr);
  const monthExpense = monthTxns.filter(f=>f.type==='expense').reduce((s,f)=>s+f.amount,0);
  const monthIncome = monthTxns.filter(f=>f.type==='income').reduce((s,f)=>s+f.amount,0);
  document.getElementById('monthExpense').textContent = '¥' + monthExpense.toLocaleString();
  document.getElementById('monthExpenseSub').textContent = '预算 ¥' + s.monthlyBudget.toLocaleString();
  document.getElementById('monthIncome').textContent = '¥' + monthIncome.toLocaleString();

  // Savings months
  const allExpense = finance.filter(f=>f.type==='expense');
  if(allExpense.length>0 && monthExpense>0){
    const months = Math.floor(s.savings / monthExpense * 10) / 10;
    document.getElementById('savingsMonths').textContent = months + ' 个月';
  } else {
    document.getElementById('savingsMonths').textContent = '--';
  }

  // Pie chart
  renderExpensePie(monthTxns.filter(f=>f.type==='expense'));

  // Transaction list
  const list = document.getElementById('txnList');
  if(finance.length===0){
    list.innerHTML = `<div class="empty">${ICONS.empty}<div class="empty-text">还没有收支记录</div></div>`;
    return;
  }
  finance.sort((a,b)=>b.date.localeCompare(a.date));
  list.innerHTML = finance.map(f=>{
    const bg = CAT_EMOJI_MAP[f.category] || '#F3F4F6';
    return `
    <div class="txn-item">
      <div class="txn-cat" style="background:${bg}">${f.category.slice(0,1)}</div>
      <div class="txn-info">
        <div class="txn-cat-name">${f.category}${f.note?' · '+f.note:''}</div>
        <div class="txn-note">${fmtDateFull(f.date)}</div>
      </div>
      <div class="txn-amount ${f.type}">${f.type==='expense'?'-':'+'}¥${f.amount.toLocaleString()}</div>
      <button class="txn-del" onclick="deleteTxn('${f.id}')">${ICONS.trash}</button>
    </div>`;
  }).join('');
}
function renderExpensePie(expenses){
  const svg = document.getElementById('expensePie');
  const legend = document.getElementById('pieLegend');
  if(expenses.length===0){
    svg.innerHTML = '<circle cx="60" cy="60" r="50" fill="none" stroke="#F3F4F6" stroke-width="20"/><text x="60" y="65" text-anchor="middle" fill="#9CA3AF" font-size="12">暂无支出</text>';
    legend.innerHTML = '';
    return;
  }
  // Group by category
  const cats = {};
  expenses.forEach(f=>{ cats[f.category] = (cats[f.category]||0) + f.amount; });
  const total = Object.values(cats).reduce((a,b)=>a+b,0);
  const colors = ['#F59E0B','#EF4444','#3B82F6','#8B5CF6','#10B981','#EC4899','#6366F1','#6B7280'];
  let offset = 0;
  let circles = `<circle cx="60" cy="60" r="50" fill="none" stroke="#F3F4F6" stroke-width="20"/>`;
  let legends = '';
  let colorIdx = 0;
  Object.entries(cats).sort((a,b)=>b[1]-a[1]).forEach(([cat,amt])=>{
    const pct = amt/total;
    const dash = pct * 314.16; // 2*PI*50
    const color = colors[colorIdx % colors.length];
    circles += `<circle cx="60" cy="60" r="50" fill="none" stroke="${color}" stroke-width="20" stroke-dasharray="${dash} 314.16" stroke-dashoffset="${-offset}" transform="rotate(-90 60 60)"/>`;
    legends += `<div class="pie-legend-item"><div class="pie-legend-dot" style="background:${color}"></div>${cat} ¥${amt.toLocaleString()} (${Math.round(pct*100)}%)</div>`;
    offset += dash;
    colorIdx++;
  });
  svg.innerHTML = circles + `<text x="60" y="58" text-anchor="middle" fill="#1F2937" font-size="14" font-weight="700">¥${total>=10000?(total/10000).toFixed(1)+'万':total.toLocaleString()}</text><text x="60" y="72" text-anchor="middle" fill="#9CA3AF" font-size="10">本月支出</text>`;
  legend.innerHTML = legends;
}

function exportCSV(){
  const finance = getData(KEYS.finance);
  if(finance.length===0){ alert('没有数据可导出'); return; }
  let csv = '\uFEFF日期,类型,金额,分类,备注\n';
  finance.forEach(f=>{
    csv += `${f.date},${f.type==='expense'?'支出':'收入'},${f.amount},${f.category},${f.note||''}\n`;
  });
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '失业互助台-收支记录-'+todayStr()+'.csv';
  a.click();
  URL.revokeObjectURL(url);
}

    list.innerHTML = `<div class="empty">${ICONS.empty}<div class="empty-text">还没有学习计划，点击「新增计划」开始</div></div>`;
    return;
  }
  list.innerHTML = skills.map(s=>{
    const pct = s.target>0 ? Math.min(100, Math.round(s.current/s.target*100)) : 0;
    const streak = calcStreak(s.checkins||{});
    const checkedToday = s.checkins && s.checkins[today];
    // Heatmap (last 14 days)
    let heatHTML = '';
    for(let i=13;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const ds = d.toISOString().slice(0,10);
      const v = (s.checkins||{})[ds];
      const cls = v ? 'l'+Math.min(4, Math.ceil(streak/3)||1) : '';
      heatHTML += `<div class="heat-cell ${v?cls:''}"></div>`;
    }
    return `
    <div class="skill-card">
      <div class="skill-header">
        <div>
          <div class="skill-name">${s.name}</div>
          <div class="skill-type">${s.type}${s.dailyGoal?' · '+s.dailyGoal:''}</div>
        </div>
        <div class="skill-streak">${ICONS.fire} ${streak}天连续</div>
      </div>
      ${s.target>0?`
        <div class="skill-progress-bar"><div class="skill-progress-fill" style="width:${pct}%"></div></div>
        <div class="skill-progress-text"><span>${s.current} / ${s.target}</span><span>${pct}%</span></div>
      `:''}
      <div class="skill-heatmap">${heatHTML}</div>
      <div class="skill-actions">
        <button class="btn-checkin-skill ${checkedToday?'done':''}" onclick="checkinSkill('${s.id}')">${checkedToday?'今日已打卡':'今日打卡'}</button>
        <button class="btn-edit-skill" onclick="editSkill('${s.id}')">编辑</button>
        <button class="btn-del-skill" onclick="deleteSkill('${s.id}')">删除</button>
      </div>
    </div>`;
  }).join('');
}
function calcStreak(checkins){
  let streak = 0;
  let d = new Date();
  // Check today first
  const today = todayStr();
  if(!checkins[today]){
    d.setDate(d.getDate()-1);
  }
  while(true){
    const ds = d.toISOString().slice(0,10);
    if(checkins[ds]){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}
function checkinSkill(id){
  const skills = getData(KEYS.skills);
  const s = skills.find(x=>x.id===id);
  if(!s) return;
  const today = todayStr();
  if(!s.checkins) s.checkins = {};
  if(s.checkins[today]){
    delete s.checkins[today];
  } else {
    s.checkins[today] = 1;
    if(s.target>0) s.current = Math.min(s.target, s.current+1);
  }
  setData(KEYS.skills, skills);
  renderSkills();
  renderToday();
  checkBackupReminder();
}
function openSkillModal(id){
  document.getElementById('skillModal').classList.add('show');
  if(id){
    const skills = getData(KEYS.skills);
    const s = skills.find(x=>x.id===id);
    if(!s) return;
    document.getElementById('skillModalTitle').textContent = '编辑学习计划';
    document.getElementById('skillId').value = s.id;
    document.getElementById('skillName').value = s.name||'';
    document.getElementById('skillType').value = s.type||'其他';
    document.getElementById('skillCurrent').value = s.current||0;
    document.getElementById('skillTarget').value = s.target||0;
    document.getElementById('skillDailyGoal').value = s.dailyGoal||'';
  } else {
    document.getElementById('skillModalTitle').textContent = '新增学习计划';
    document.getElementById('skillId').value = '';
    document.getElementById('skillName').value = '';
    document.getElementById('skillType').value = '刷题';
    document.getElementById('skillCurrent').value = '';
    document.getElementById('skillTarget').value = '';
    document.getElementById('skillDailyGoal').value = '';
  }
}
function saveSkill(){
  const name = document.getElementById('skillName').value.trim();
  if(!name){ alert('请填写计划名称'); return; }
  const skill = {
    id: document.getElementById('skillId').value || genId(),
    name,
    type: document.getElementById('skillType').value,
    current: parseInt(document.getElementById('skillCurrent').value)||0,
    target: parseInt(document.getElementById('skillTarget').value)||0,
    dailyGoal: document.getElementById('skillDailyGoal').value.trim(),
    checkins: {}
  };
  const skills = getData(KEYS.skills);
  const idx = skills.findIndex(s=>s.id===skill.id);
  if(idx>=0){
    skill.checkins = skills[idx].checkins || {};
    skills[idx] = skill;
  } else {
    skills.push(skill);
  }
  setData(KEYS.skills, skills);
  closeModal('skillModal');
  renderSkills();
  renderToday();
  checkBackupReminder();
}
function editSkill(id){ openSkillModal(id); }
function deleteSkill(id){
  showConfirm('删除学习计划','确定删除这个学习计划吗？打卡记录也会一并删除。',()=>{
    const skills = getData(KEYS.skills).filter(s=>s.id!==id);
    setData(KEYS.skills, skills);
    renderSkills();
    renderToday();
  });
}

/* ===== Modals ===== */
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function showConfirm(title,text,callback){
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmText').textContent = text;
  document.getElementById('confirmOverlay').classList.add('show');
  document.getElementById('confirmYes').onclick = function(){
    closeConfirm();
    callback();
  };
}
function closeConfirm(){ document.getElementById('confirmOverlay').classList.remove('show'); }

/* ===== Export / Import ===== */
function exportJSON(){
  const data = {
    jobs: getData(KEYS.jobs),
    diary: getData(KEYS.diary),
    finance: getData(KEYS.finance),
    skills: getData(KEYS.skills),
    settings: getSettings(),
    exportDate: new Date().toISOString(),
    version: '1.0'
  };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '失业互助台-备份-'+todayStr()+'.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importJSON(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      showConfirm('导入数据',`即将导入备份文件，当前数据将被覆盖。导入内容：${(data.jobs||[]).length}条求职、${(data.diary||[]).length}条日记、${(data.finance||[]).length}条收支、${(data.skills||[]).length}条学习计划。确认导入？`,()=>{
        if(data.jobs) setData(KEYS.jobs, data.jobs);
        if(data.diary) setData(KEYS.diary, data.diary);
        if(data.finance) setData(KEYS.finance, data.finance);
        if(data.skills) setData(KEYS.skills, data.skills);
        if(data.settings) setData(KEYS.settings, data.settings);
        renderAll();
        alert('导入成功！');
      });
    }catch(err){
      alert('导入失败：文件格式错误');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ===== Backup Reminder ===== */
function checkBackupReminder(){
  const total = getData(KEYS.jobs).length + getData(KEYS.diary).length + getData(KEYS.finance).length + getData(KEYS.skills).length;
  const reminder = document.getElementById('backupReminder');
  if(total >= 30){
    reminder.style.display = 'block';
    reminder.textContent = `数据已积累 ${total} 条，建议点击右上角「导出备份」保存一份副本`;
  } else {
    reminder.style.display = 'none';
  }
}

/* ===== Clear Sample Data ===== */
function clearSampleData(){
  showConfirm('清空示例数据','将删除所有预置示例数据，此操作不可撤销。确认清空？',()=>{
    Object.keys(KEYS).forEach(k=>localStorage.removeItem(KEYS[k]));
    initSampleData();
    setData(KEYS.jobs,[]);
    setData(KEYS.diary,[]);
    setData(KEYS.finance,[]);
    setData(KEYS.skills,[]);
    renderAll();
  });
}

/* ===== Render All ===== */
function renderAll(){
  renderToday();
  renderJobs();
  renderMoodOptions();
  renderDayCounter();
  refreshQuote();
  renderDiaryCheckinStatus();
  renderDiaryList();
  renderFinance();
  renderSkills();
  checkBackupReminder();
}

/* ===== Init ===== */
(function init(){
  // Check if first visit
  if(!localStorage.getItem(KEYS.settings)){
    initSampleData();
  } else {
    // Ensure settings exist
    const s = getSettings();
    setData(KEYS.settings, s);
  }
  renderAll();

  // Close modals on overlay click
  document.querySelectorAll('.modal-overlay').forEach(m=>{
    m.addEventListener('click',function(e){
      if(e.target === m) m.classList.remove('show');
    });
  });
  document.getElementById('confirmOverlay').addEventListener('click',function(e){
    if(e.target === this) closeConfirm();
  });
  document.getElementById('shareOverlay').addEventListener('click',function(e){
    if(e.target === this) closeShare();
  });
})();
</script>
